<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<!-- 官网版客服台：接口走 https://9a-studio.cpolar.top，登录态用 localStorage 9a_token -->
<meta name="robots" content="noindex,nofollow">
<title>9A 客服台 · 询盘分级</title>
<link rel="icon" href="/assets/logo.png">
<link rel="apple-touch-icon" href="/assets/logo.png">
<style>
:root{--bg:#23262a;--card:#2b2f34;--line:#3a3f45;--brand:#e76126;--txt:#e8eaec;--muted:#9aa1a8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
*,*::before,*::after{box-shadow:none!important;text-shadow:none!important}
*:focus,*:focus-visible,*:focus-within{outline:none!important}
body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 "Segoe UI",system-ui,"Microsoft YaHei",sans-serif}
.wrap{max-width:1080px;margin:0 auto;padding:22px 16px 40px}
.hd{display:flex;align-items:center;gap:16px;margin-bottom:18px;flex-wrap:wrap}
.hd .btn{white-space:nowrap;flex:0 0 auto}
#who{white-space:nowrap}
@media (max-width:560px){
  .hd{gap:12px}
  .hd .spacer{display:none}
  h1{font-size:17px}
  .logo{width:36px;height:36px;flex:0 0 36px}
  .hd .btn{padding:8px 12px;font-size:13px}
  #who{order:5;flex:1 0 100%;font-size:12px}
  .stat{grid-template-columns:repeat(3,1fr);gap:10px}
  .stat .box b{font-size:22px}
  .stat .box span{font-size:12px}
}
.logo{width:44px;height:44px;flex:0 0 44px;border-radius:50%;object-fit:cover;background:var(--card)}
h1{font-size:19px;margin:0;font-weight:600}
.sub{color:var(--muted);font-size:12.5px}
.spacer{flex:1}
.btn{background:var(--brand);color:#1a1a1a;border:0;border-radius:10px;padding:9px 16px;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.4;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:500}
.chips{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px}
.chip{border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:999px;padding:8px 17px;cursor:pointer;font-size:13.5px}
.chip.on{border-color:var(--brand);color:var(--brand)}
.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}
.box{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
.box b{font-size:24px;display:block;line-height:1.25}
.box span{color:var(--muted);font-size:12.5px;display:block;margin-top:3px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:block;padding:14px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.rh{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm{font-size:14.5px;font-weight:700}
.un{font-size:12.5px;color:var(--brand);text-decoration:none}
.rh .sp{flex:1}
.t{color:var(--muted);font-size:12.5px;white-space:nowrap}
.tag{font-size:11.5px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
.lv{font-weight:700;text-align:center;border-radius:8px;padding:2px 9px;font-size:12px}
.lv.A{background:rgba(231,97,38,.16);color:var(--brand);border:1px solid var(--brand)}
.lv.B{background:rgba(255,196,0,.12);color:#ffc400;border:1px solid #806200}
.lv.C{background:rgba(154,161,168,.12);color:var(--muted);border:1px solid var(--line)}
.msg{color:#cfd5da;font-size:13.5px;line-height:1.55;margin-top:9px;padding:10px 12px;background:rgba(255,255,255,.035);border-radius:9px;white-space:pre-wrap;word-break:break-word}
.rf{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:12px}
.rf a{color:var(--brand);text-decoration:none}
.rsn{color:var(--muted);font-size:12px}
.empty{padding:40px;text-align:center;color:var(--muted)}
.pager{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:16px;flex-wrap:wrap}
.pager button{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:13px}
.pager button:disabled{opacity:.35;cursor:default}
.pager .num{min-width:34px;text-align:center;border-radius:9px;padding:7px 10px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}
.pager .num.on{border-color:var(--brand);color:var(--brand);font-weight:700}
.pager .info{color:var(--muted);font-size:12.5px;margin:0 6px}
.hint{color:var(--muted);font-size:12.5px;margin-top:12px}
</style>
</head>
<body>
<div class="wrap">
  <div class="hd">
    <img class="logo" src="/assets/logo.png" alt="9A Battery">
    <div><h1>客服台 · 询盘分级</h1><div class="sub">Telegram 私聊自动回复 + A/B/C 分级</div></div>
    <div class="spacer"></div>
    <span class="sub" id="who"></span>
    <a class="btn ghost" id="backWork" href="/publish.html" style="text-decoration:none">← 工作台</a>
  </div>

  <div class="stat">
    <div class="box"><b id="cAll">0</b><span>总询盘</span></div>
    <div class="box"><b id="cA" style="color:var(--brand)">0</b><span>A 级（问价/批量）</span></div>
    <div class="box"><b id="cB" style="color:#ffc400">0</b><span>B 级（问参数/物流）</span></div>
  </div>

  <div class="chips">
    <div class="chip on" data-lv="">全部</div>
    <div class="chip" data-lv="A">只看 A 级</div>
    <div class="chip" data-lv="B">只看 B 级</div>
    <div class="chip" data-lv="C">只看 C 级</div>
  </div>

  <div class="card" id="list"><div class="empty">加载中…</div></div>
  <div class="pager" id="pager"></div>
  <div class="hint" id="hint"></div>
</div>
<script>
const API_BASE = 'https://9a-studio.cpolar.top';
const LS_TOKEN = '9a_token';
let token = localStorage.getItem(LS_TOKEN) || '';
const abs = u => (!u ? u : (/^https?:/.test(u) ? u : API_BASE + u));
const ah = () => (token ? {'X-Token': token} : {});
const PAGE_SIZE = 20;
const BACK_URL = '/publish.html';      // 没登录就回工作台登录，不许直接进这页
let page = 1, filter = '', total = 0, pages = 1, rows = [];
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function ts2t(ts){
  if(!ts) return '';
  const d = new Date(ts*1000), p = n => String(n).padStart(2,'0');
  return (d.getMonth()+1)+'月'+p(d.getDate())+'日 '+p(d.getHours())+':'+p(d.getMinutes());
}
function render(){
  $('#cAll').textContent = statsTotal !== null ? statsTotal : (filter ? total : (total || rows.length));
  $('#cA').textContent = document.querySelector('.chip[data-lv="A"]').dataset.cnt || 0;
  $('#cB').textContent = document.querySelector('.chip[data-lv="B"]').dataset.cnt || 0;
  if(!rows.length){
    $('#list').innerHTML = '<div class="empty">' + (filter ? '这个等级还没有询盘。' : '还没有询盘。有人私聊机器人后会出现在这里。') + '</div>';
    return;
  }
  $('#list').innerHTML = rows.map(r=>{
    const un = r.username ? ('https://t.me/' + encodeURIComponent(r.username)) : ('tg://user?id=' + encodeURIComponent(r.tg_id || ''));
    const unTxt = r.username ? ('@' + esc(r.username)) : ('TG ID ' + esc(r.tg_id || '—'));
    return `
    <div class="row">
      <div class="rh">
        <span class="lv ${esc(r.level)}">${esc(r.level)} 级</span>
        <span class="nm">${esc(r.name) || '未署名'}</span>
        <a class="un" href="${un}" target="_blank" rel="noopener">${unTxt}</a>
        <span class="tag">TG</span>
        <span class="tag">${esc(r.lang || '—')}</span>
        <span class="sp"></span>
        <span class="t">${ts2t(r.ts)}</span>
      </div>
      <div class="msg">${esc(r.message) || '（空消息）'}</div>
      <div class="rf">
        <span>ID ${esc(r.tg_id || '—')}</span>
        <span>·</span>
        <span>${r.replied ? '已自动回复' : '未回复'}</span>
        ${r.reason?`<span>·</span><span>分级：${esc(r.reason)}</span>`:''}
        <a href="${un}" target="_blank" rel="noopener">打开对话 →</a>
      </div>
      ${r.error?`<div class="msg" style="color:#ff7b72;background:rgba(255,123,114,.08)">${esc(r.error)}</div>`:''}
    </div>`;
  }).join('');
}
function renderPager(){
  if(!pages || pages <= 1){ $('#pager').innerHTML = ''; return; }
  let nums = [];
  const from = Math.max(1, Math.min(page-2, pages-4)), to = Math.min(pages, from+4);
  for(let i=from;i<=to;i++) nums.push(`<div class="num${i===page?' on':''}" data-p="${i}">${i}</div>`);
  $('#pager').innerHTML = `
    <button id="pPrev" ${page<=1?'disabled':''}>上一页</button>
    ${nums.join('')}
    <button id="pNext" ${page>=pages?'disabled':''}>下一页</button>
    <span class="info">第 ${page} / ${pages} 页 · 共 ${total} 条</span>`;
  $('#pPrev').onclick = ()=>{ if(page>1){ page--; load(); } };
  $('#pNext').onclick = ()=>{ if(page<pages){ page++; load(); } };
  document.querySelectorAll('#pager .num').forEach(n=>{
    n.onclick = ()=>{ page = Number(n.dataset.p); load(); };
  });
}
async function load(){
  const btn = $('#btnRefresh'); if (btn) btn.disabled = true;
  try{
    // 先看当前是谁登录的，出错时能把原因说清楚
    try{
      const mr = await fetch(abs('/api/me'), {headers:ah()});
      if(mr.status === 200){
        const m = await mr.json();
        $('#who').textContent = '当前账号：' + (m.name || m.username) + '（' + m.role + '）';
      }else{
        // 没登录：不在这页停留，直接送回工作台去登录
        location.replace(BACK_URL);
        return;
      }
    }catch(e){}
    const url = '/api/leads?limit='+PAGE_SIZE+'&page='+page+(filter?('&level='+filter):'');
    const r = await fetch(abs(url), {headers:ah()});
    if(r.status === 401){
      $('#list').innerHTML = '<div class="empty">没登录。<a style="color:#e76126" href="/publish.html">去工作台用管理员账号登录</a>，登录后这页会自动更新。</div>';
      $('#pager').innerHTML = ''; if(btn) btn.disabled=false; return;
    }
    if(r.status === 403){
      $('#list').innerHTML = '<div class="empty">客服询盘只对管理员开放，当前登录的是演示账号。<a style="color:#e76126" href="/publish.html">换管理员账号登录</a>，登录后这页会自动更新。</div>';
      $('#pager').innerHTML = ''; if(btn) btn.disabled=false; return;
    }
    const d = await r.json();
    rows = d.leads || []; total = d.total || rows.length; pages = d.pages || 1; page = d.page || 1;
    if(page > pages && pages > 0){ page = pages; return load(); }
    // 顶部计数用接口给的总数（按等级分开统计）
    document.querySelector('.chip[data-lv=""]').dataset.cnt = d.total || 0;
    render();
    renderPager();
    $('#hint').textContent = '每页 ' + PAGE_SIZE + ' 条，按时间倒序；点页码或上一页/下一页翻。';
  }catch(e){
    $('#list').innerHTML = '<div class="empty">读取失败：'+esc(e.message)+'</div>';
  }finally{ if(btn) btn.disabled = false; }
}
let statsTotal = null;
async function loadCounts(){
  try{
    // 分级计数走列表接口的 total（跟翻页同一套接口，最稳）
    for(const lv of ['A','B','C']){
      const r = await fetch(abs('/api/leads?limit=1&page=1&level='+lv), {headers:ah()});
      if(r.status !== 200) continue;
      const d = await r.json();
      const chip = document.querySelector('.chip[data-lv="'+lv+'"]');
      if(chip) chip.dataset.cnt = String(d.total || 0);
      if(lv==='A') $('#cA').textContent = d.total || 0;
      if(lv==='B') $('#cB').textContent = d.total || 0;
    }
    const all = await fetch(abs('/api/leads?limit=1&page=1'), {headers:ah()});
    if(all.status === 200){ const d = await all.json(); statsTotal = d.total || 0; $('#cAll').textContent = statsTotal; }
    render();
  }catch(e){}
}
document.querySelectorAll('.chip').forEach(c=>{
  c.onclick = () => {
    document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));
    c.classList.add('on');
    filter = c.dataset.lv; page = 1; load();
  };
});
$('#btnRefresh') && ($('#btnRefresh').onclick = ()=>{ load(); loadCounts(); });
load().then(loadCounts);
// 自动刷新：每 60 秒一次；从后台切回前台也立刻拉一次（不需要"刷新"按钮）
setInterval(()=>{ if(!document.hidden){ load(); loadCounts(); } }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden){ load(); loadCounts(); } });
</script>
</body>
</html>
